name: Deploy

on:
  push:
    branches:
      - main
  # Lets the "Sync homepage" workflow trigger a deploy after it commits.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Website
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools' \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/bigscissors.com.au/

      - name: Fix Permissions and Reload Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            chown -R www-data:www-data /var/www/bigscissors.com.au &&
            find /var/www/bigscissors.com.au -type d -exec chmod 755 {} \; &&
            find /var/www/bigscissors.com.au -type f -exec chmod 644 {} \; &&
            nginx -t &&
            systemctl reload nginx
          "
